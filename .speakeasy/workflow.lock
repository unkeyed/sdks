                    fixedValue: Go (SDK)
                blocking: false
        api-py:
            target: python
            source: api-python
            output: ./api/py
            publish:
                pypi:
                    useTrustedPublishing: true
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/unkey/unkey/api-python-code-samples
                labelOverride:
                    fixedValue: Python (SDK)
                blocking: false
        api-ts:
            target: typescript
            source: api
            output: ./api/ts
            publish:
                npm:
                    token: $npm_token
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/unkey/unkey/api-typescript-code-samples
                labelOverride:
                    fixedValue: Typescript (SDK)
                blocking: false
