    speakeasyVersion: latest
    sources:
        api:
            inputs:
                - location: https://api.unkey.com/openapi.yaml
            registry:
                location: registry.speakeasyapi.dev/unkey/unkey/api
        api-python:
            inputs:
                - location: https://api.unkey.com/openapi.yaml
