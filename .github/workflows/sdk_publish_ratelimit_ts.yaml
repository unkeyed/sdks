name: Publish Ratelimit-TS

on:
  push:
    branches:
      - main
    paths:
      - "ratelimit/ts/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ratelimit/ts
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm stage publish needs npm 11.15.0 or later, which Node 24 ships.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Uploads the version to npm's staging queue. A maintainer must approve it on
      # npmjs.com (Staged Packages tab) or with `npm stage approve` before anyone can install it.
      - name: Stage on NPM
        run: npm stage publish
