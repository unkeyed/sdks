name: Publish API-PY
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - api/py/.speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  publish:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    with:
      target: api-py
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      pypi_token: ${{ secrets.PYPI_TOKEN }}
      slack_webhook_url: ${{secrets.SLACK_WEBHOOK_URL}}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
  publish-pypi:
    needs: publish
    if: ${{ needs.publish.outputs.python_regenerated == 'true' &&
      needs.publish.outputs.publish_python == 'true' &&
      needs.publish.outputs.use_pypi_trusted_publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: speakeasy-api/sdk-generation-action/publish-pypi@v15
        with:
          python-directory: ${{ needs.publish.outputs.python_directory }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
