name: Publish API-PY
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - api/py/.speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  publish:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    with:
      target: api-py
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      slack_webhook_url: ${{secrets.SLACK_WEBHOOK_URL}}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
  publish-pypi:
    if: ${{ needs.publish.outputs.python_regenerated == 'true' && needs.publish.outputs.publish_python == 'true' && needs.publish.outputs.use_pypi_trusted_publishing == 'true' }}
    name: Publish Python SDK
    needs: publish
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.10"
      - name: Build package
        working-directory: ${{ needs.publish.outputs.python_directory }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: ${{ needs.publish.outputs.python_directory }}/dist/
